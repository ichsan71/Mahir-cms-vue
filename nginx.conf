# Konfigurasi Nginx untuk menyajikan SPA Mahir CMS (hasil build Vite).
# Disalin ke /etc/nginx/conf.d/default.conf oleh Dockerfile (stage production).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sembunyikan versi Nginx di header respons/halaman error.
    server_tokens off;

    # ── Security headers (SEC-11) ───────────────────────────────────────────
    # Header non-CSP: risiko rendah, langsung enforce.
    add_header X-Frame-Options "DENY" always;                 # anti-clickjacking
    add_header X-Content-Type-Options "nosniff" always;        # cegah MIME sniffing
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # App memakai GPS + kamera (check-in selfie) → izinkan untuk origin sendiri saja.
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;

    # Content-Security-Policy digelar sebagai REPORT-ONLY lebih dulu: browser
    # TIDAK memblokir apa pun, hanya melaporkan pelanggaran di Console DevTools.
    # Setelah diverifikasi tidak ada pelanggaran yang sah (peta, check-in GPS+selfie,
    # FCM, konten pengumuman semua normal), ganti nama header di bawah menjadi
    # "Content-Security-Policy" (tanpa -Report-Only) untuk menegakkannya.
    #
    # Origin yang diizinkan (dari pemakaian nyata app):
    #   script  : self (bundle) + Google Maps + gstatic (Firebase SDK di service worker)
    #   connect : self (GraphQL same-origin /graphql) + wss (subscription) + Google/Firebase APIs
    #   img     : self + data:/blob: (preview selfie) + https: (domain media & tile peta)
    #   worker  : self (firebase-messaging-sw.js)
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://maps.googleapis.com https://*.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' wss: https://*.googleapis.com; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # SPA fallback: semua route diarahkan ke index.html (vue-router history mode).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
