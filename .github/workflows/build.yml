name: build-image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: 100.112.199.24:5000
  IMAGE: mazta-erp/mahir-cms

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Hitung tag
        id: meta
        run: |
          TAGS="sha-${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAGS="$TAGS ${GITHUB_REF_NAME#v}"
          else
            TAGS="$TAGS latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          ARGS=""
          for t in ${{ steps.meta.outputs.tags }}; do
            ARGS="$ARGS -t $REGISTRY/$IMAGE:$t"
          done
          # Nilai VITE_* "dibakar" ke bundel frontend saat build (client-side).
          # Simpan di GitHub: Settings > Secrets and variables > Actions > Variables
          podman build $ARGS \
            --ulimit nofile=65535:65535 \
            --build-arg VITE_GRAPHQL_URI="${{ vars.VITE_GRAPHQL_URI }}" \
            --build-arg VITE_GOOGLE_MAPS_API_KEY="${{ vars.VITE_GOOGLE_MAPS_API_KEY }}" \
            --build-arg VITE_FIREBASE_API_KEY="${{ vars.VITE_FIREBASE_API_KEY }}" \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN="${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg VITE_FIREBASE_PROJECT_ID="${{ vars.VITE_FIREBASE_PROJECT_ID }}" \
            --build-arg VITE_FIREBASE_STORAGE_BUCKET="${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}" \
            --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID="${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}" \
            --build-arg VITE_FIREBASE_APP_ID="${{ vars.VITE_FIREBASE_APP_ID }}" \
            --build-arg VITE_FIREBASE_MEASUREMENT_ID="${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}" \
            --build-arg VITE_FIREBASE_VAPID_KEY="${{ vars.VITE_FIREBASE_VAPID_KEY }}" \
            -f Dockerfile .

      - name: Push
        run: |
          for t in ${{ steps.meta.outputs.tags }}; do
            podman push $REGISTRY/$IMAGE:$t --tls-verify=false
          done
